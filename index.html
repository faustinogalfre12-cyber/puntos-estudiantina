<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero de puntos · Estudiantina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#14213d;--mute:#5b6679;--line:#dde2ea;--btn:#14213d;--btnink:#fff;--bad:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141d;--card:#17202c;--ink:#eef2f8;--mute:#9aa6b8;--line:#263344;--btn:#eef2f8;--btnink:#0e141d;--bad:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e141d;--card:#17202c;--ink:#eef2f8;--mute:#9aa6b8;--line:#263344;--btn:#eef2f8;--btnink:#0e141d;--bad:#ff7b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
h1{font-size:clamp(2.2rem,8vw,3.6rem);line-height:1;margin:8px 0 4px;font-weight:800}
h2{font-size:1.5rem;margin:0 0 12px;font-weight:800}
.sub{color:var(--mute);margin:0 0 20px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.pos{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:2.2rem;line-height:1;text-align:center;color:var(--mute)}
.row:nth-child(1) .pos{color:#d4a017}.row:nth-child(2) .pos{color:#8a97a8}.row:nth-child(3) .pos{color:#b06a2c}
.name{font-weight:600;font-size:1.1rem}
.bar{height:10px;border-radius:6px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .5s}
.num{font-size:2.4rem;font-weight:800;line-height:1;text-align:right}
.num small{display:block;font-size:.9rem;font-weight:600;color:var(--mute)}
.quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.q{padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 .9rem Barlow,sans-serif;cursor:pointer;min-height:32px}
.q:hover{border-color:var(--ink)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-weight:500;font-size:.95rem}
select,input{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px;width:100%}
button.main{grid-column:1/-1;background:var(--btn);color:var(--btnink);border:0;border-radius:10px;padding:12px;font:700 1.05rem Barlow,sans-serif;cursor:pointer;min-height:48px}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.log{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto}
.log li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pts{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.3rem;min-width:52px;text-align:right}
.pts.neg{color:var(--bad)}
.grow{flex:1;min-width:0}.grow small{color:var(--mute);display:block}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:1.1rem;min-width:36px;min-height:36px}
.empty{color:var(--mute);margin:0}
details summary{cursor:pointer;font-weight:600}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0}
.danger{background:transparent;border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:8px 14px;font:600 .95rem Barlow,sans-serif;cursor:pointer;min-height:40px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<h1 id="titulo">Estudiantina</h1>
<p class="sub">Tablero de puntos de los 6 cursos de secundaria. Se actualiza al instante.</p>

<section aria-labelledby="h-rank">
<h2 id="h-rank">Posiciones</h2>
<div id="rank"></div>
</section>

<section aria-labelledby="h-add">
<h2 id="h-add">Cargar puntos</h2>
<form id="f">
<label>Curso<select id="curso"></select></label>
<label>Actividad<select id="act"></select></label>
<label>Puntos<input id="pts" type="number" step="1" value="10" required></label>
<label>Detalle (opcional)<input id="det" type="text" maxlength="80" placeholder="Ej.: Prueba de relevos"></label>
<button class="main" type="submit">Sumar puntos</button>
</form>
</section>

<section aria-labelledby="h-log">
<h2 id="h-log">Historial</h2>
<ul class="log" id="log"></ul>
</section>

<section>
<details>
<summary>Configuración</summary>
<div class="names" id="names"></div>
<label style="max-width:380px">Título del evento<input id="ttl" type="text" maxlength="40"></label>
<p style="margin:16px 0 8px"><button class="danger" id="reset" type="button">Borrar todos los puntos</button></p>
</details>
</section>
</main>

<script>
const COLORS=["#e63946","#f4a300","#2a9d8f","#3a86ff","#8e44ad","#e56b9b"];
const ACTS=[["Participación",10],["1.er puesto",50],["2.º puesto",30],["3.er puesto",20],["Mejor disfraz",25],["Mejor bandera",25],["Puntualidad",5],["Sanción",-10],["Otra",10]];
let S={title:"Estudiantina",names:["1.º año","2.º año","3.º año","4.º año","5.º año","6.º año"],log:[]};
try{const r=localStorage.getItem("estudiantina-v1");if(r){const p=JSON.parse(r);if(p&&p.names&&p.log)S=p}}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem("estudiantina-v1",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const total=i=>S.log.filter(l=>l.c===i).reduce((a,l)=>a+l.p,0);
function add(c,p,d){S.log.unshift({c:+c,p:+p,d:d||"",t:Date.now()});save();draw()}
function draw(){
  document.title="Tablero de puntos · "+S.title;$("titulo").textContent=S.title;
  const tots=S.names.map((n,i)=>({i,n,t:total(i)})).sort((a,b)=>b.t-a.t||a.i-b.i);
  const max=Math.max(1,...tots.map(x=>x.t));
  $("rank").innerHTML=tots.map((x,k)=>`<div class="row"><div class="pos">${k+1}</div><div><div class="name">${esc(x.n)}</div><div class="bar"><i style="width:${Math.max(0,x.t)/max*100}%;background:${COLORS[x.i]}"></i></div><div class="quick"><button class="q" data-c="${x.i}" data-p="5">+5</button><button class="q" data-c="${x.i}" data-p="10">+10</button><button class="q" data-c="${x.i}" data-p="-5">−5</button></div></div><div class="num">${x.t}<small>puntos</small></div></div>`).join("");
  const sel=$("curso").value;
  $("curso").innerHTML=S.names.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join("");if(sel)$("curso").value=sel;
  $("log").innerHTML=S.log.length?S.log.map((l,k)=>`<li><span class="dot" style="background:${COLORS[l.c]}"></span><div class="grow"><strong>${esc(S.names[l.c])}</strong><small>${esc(l.d||"Sin detalle")} · ${new Date(l.t).toLocaleString("es-AR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</small></div><span class="pts ${l.p<0?"neg":""}">${l.p>0?"+":""}${l.p}</span><button class="x" data-k="${k}" aria-label="Deshacer esta carga">✕</button></li>`).join(""):'<p class="empty">Todavía no hay puntos cargados. Usá el formulario para empezar.</p>';
}
$("act").innerHTML=ACTS.map((a,i)=>`<option value="${i}">${a[0]}</option>`).join("");
$("act").onchange=()=>{$("pts").value=ACTS[$("act").value][1]};
$("f").onsubmit=e=>{e.preventDefault();const a=ACTS[$("act").value][0];const d=$("det").value.trim();add($("curso").value,$("pts").value,d?a+": "+d:a);$("det").value=""};
$("rank").onclick=e=>{const b=e.target.closest(".q");if(b)add(b.dataset.c,b.dataset.p,"Carga rápida")};
$("log").onclick=e=>{const b=e.target.closest(".x");if(b){S.log.splice(+b.dataset.k,1);save();draw()}};
$("names").innerHTML=S.names.map((n,i)=>`<label>Curso ${i+1}<input data-n="${i}" value="${esc(n)}" maxlength="20"></label>`).join("");
$("names").oninput=e=>{const i=e.target.dataset.n;if(i!==undefined){S.names[i]=e.target.value||"Curso "+(+i+1);save();draw()}};
$("ttl").value=S.title;$("ttl").oninput=e=>{S.title=e.target.value||"Estudiantina";save();draw()};
let armed=false;
$("reset").onclick=()=>{const b=$("reset");if(!armed){armed=true;b.textContent="Tocá de nuevo para confirmar";setTimeout(()=>{armed=false;b.textContent="Borrar todos los puntos"},4000)}else{S.log=[];save();draw();armed=false;b.textContent="Borrar todos los puntos"}};
draw();
</script>
</body>
</html>
